apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: atlas-events

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: atlas-api
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [atlas-api.atlas-events.svc.cluster.local:8080]
        relabel_configs:
          - target_label: app
            replacement: atlas-api

      - job_name: atlas-scraper
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [atlas-scraper-service.atlas-events.svc.cluster.local:8081]
        relabel_configs:
          - target_label: app
            replacement: atlas-scraper
