apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-api
  namespace: monitoring
data:
  api.json: |
    {
      "title": "Atlas Events — API",
      "uid": "atlas-api",
      "schemaVersion": 38,
      "refresh": "15s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Requests per Second",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"atlas-api\"}[1m])) by (uri, method)",
            "legendFormat": "{{method}} {{uri}}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2, "type": "timeseries", "title": "HTTP 5xx Error Rate",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"atlas-api\",status=~\"5..\"}[5m]))",
            "legendFormat": "5xx errors/s"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" },
            "overrides": [{ "matcher": { "id": "byName", "options": "5xx errors/s" },
              "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
            }]
          }
        },
        {
          "id": 3, "type": "timeseries", "title": "Response Time Percentiles (p99 / p95 / p50)",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=\"atlas-api\"}[5m])) by (le))",
              "legendFormat": "p99"
            },
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"atlas-api\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{application=\"atlas-api\"}[5m])) by (le))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4, "type": "stat", "title": "Total Submissions Created",
          "gridPos": { "x": 0, "y": 16, "w": 6, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "atlas_submissions_created_total",
            "legendFormat": "submissions"
          }]
        }
      ]
    }
