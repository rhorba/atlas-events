apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-jvm
  namespace: monitoring
data:
  jvm.json: |
    {
      "title": "Atlas Events — JVM",
      "uid": "atlas-jvm",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Heap Used (MB)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "jvm_memory_used_bytes{area=\"heap\", application=~\"atlas-api|atlas-scraper\"} / 1024 / 1024",
            "legendFormat": "{{application}} — {{id}}"
          }],
          "fieldConfig": { "defaults": { "unit": "decmbytes" } }
        },
        {
          "id": 2, "type": "timeseries", "title": "GC Pause Duration (s)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "rate(jvm_gc_pause_seconds_sum{application=~\"atlas-api|atlas-scraper\"}[5m])",
            "legendFormat": "{{application}} — {{cause}}"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 3, "type": "stat", "title": "Live Threads",
          "gridPos": { "x": 0, "y": 8, "w": 6, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "jvm_threads_live_threads{application=\"atlas-api\"}",
            "legendFormat": "atlas-api"
          }]
        },
        {
          "id": 4, "type": "timeseries", "title": "CPU Usage",
          "gridPos": { "x": 6, "y": 8, "w": 18, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "process_cpu_usage{application=~\"atlas-api|atlas-scraper\"}",
            "legendFormat": "{{application}}"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 } }
        }
      ]
    }
