apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-scraper
  namespace: monitoring
data:
  scraper.json: |
    {
      "title": "Atlas Events — Scraper",
      "uid": "atlas-scraper",
      "schemaVersion": 38,
      "refresh": "60s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Events Found per Run (by source)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "increase(atlas_scraper_events_found_total[6h])",
            "legendFormat": "{{source}}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 2, "type": "timeseries", "title": "Scraper Runs — Total vs Failed",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "increase(atlas_scraper_runs_total_total[6h])",
              "legendFormat": "total — {{source}}"
            },
            {
              "datasource": "Prometheus",
              "expr": "increase(atlas_scraper_runs_failed_total[6h])",
              "legendFormat": "failed — {{source}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": [{ "matcher": { "id": "byRegexp", "options": "failed.*" },
              "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
            }]
          }
        },
        {
          "id": 3, "type": "stat", "title": "Success Rate (24h)",
          "gridPos": { "x": 0, "y": 8, "w": 8, "h": 4 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "1 - (sum(increase(atlas_scraper_runs_failed_total[24h])) / sum(increase(atlas_scraper_runs_total_total[24h])))",
            "legendFormat": "success rate"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "red", "value": null },
              { "color": "yellow", "value": 0.8 },
              { "color": "green", "value": 0.95 }
            ]}
          }}
        }
      ]
    }
