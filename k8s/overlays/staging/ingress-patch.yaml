apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-ingress
  namespace: atlas-events
spec:
  tls:
    - hosts:
        - staging.atlas-events.ma
      secretName: atlas-staging-tls
  rules:
    - host: staging.atlas-events.ma
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port:
                  number: 8080
          - path: /ical
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port:
                  number: 8080
          - path: /actuator/
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-web-service
                port:
                  number: 80
