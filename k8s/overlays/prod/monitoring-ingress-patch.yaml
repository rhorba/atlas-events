apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
spec:
  tls:
    - hosts:
        - grafana.atlas-events.ma
      secretName: grafana-prod-tls
  rules:
    - host: grafana.atlas-events.ma
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
