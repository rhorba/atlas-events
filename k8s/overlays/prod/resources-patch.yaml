apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: atlas-events
spec:
  template:
    spec:
      containers:
        - name: atlas-api
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
  namespace: atlas-events
spec:
  template:
    spec:
      containers:
        - name: atlas-web
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
