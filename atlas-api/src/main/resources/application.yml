spring:
  application:
    name: atlas-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlasevents}
    username: ${DATABASE_USERNAME:atlas}
    password: ${DATABASE_PASSWORD:atlas_local_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

atlas:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin_local_password}
  jwt:
    secret: ${JWT_SECRET:local_dev_jwt_secret_change_in_production_32chars_minimum}
    expiration-hours: 1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
